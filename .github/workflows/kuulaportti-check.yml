name: Kuulaportti -> Discord ilmoitus

on:
  schedule:
    # Ajetaan joka tunti (UTC-aika). Muuta tarvittaessa.
    - cron: '0 * * * *'
  workflow_dispatch: {}  # Mahdollistaa manuaalisen ajon "Run workflow" -napista

permissions:
  contents: write  # Tarvitaan, jotta workflow voi committaa päivittyneen seen_events.json:n

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run check script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node check_kuulaportti.js

      - name: Commit updated seen_events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_events.json
          git diff --quiet --cached || git commit -m "Päivitetään nähdyt tapahtumat"
          git push
