name: Kuulaportti -> Discord ilmoitus

on:
  # Pääasiallinen käynnistys tulee ulkoiselta ajastimelta (cron-job.org) workflow_dispatchin kautta.
  workflow_dispatch: {}
  schedule:
    # Varajärjestelmä kerran tunnissa, jos ulkoinen ajastin on joskus pois toiminnasta.
    - cron: '23 * * * *'

permissions:
  contents: write  # Tarvitaan, jotta workflow voi committaa päivittyneen seen_events.json:n

# Estää kahta ajoa pyörimästä yhtä aikaa -> ei tuplailmoituksia päällekkäisistä ajoista.
concurrency:
  group: kuulaportti-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run check script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KUULAPORTTI_API_KEY: ${{ secrets.KUULAPORTTI_API_KEY }}
        run: node check_kuulaportti.js

      - name: Commit updated seen_events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_events.json
          if git diff --quiet --cached; then
            echo "Ei muutoksia committoitavaksi."
          else
            git commit -m "Päivitetään nähdyt tapahtumat"
            # Haetaan mahdolliset toisen ajon tekemät muutokset ennen pushia.
            git pull --rebase origin main
            git push
          fi
