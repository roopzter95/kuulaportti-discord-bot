name: Kuulaportti -> Discord ilmoitus

on:
  schedule:
    # Ajetaan 15 minuutin välein. Näin uusi ilmoitus tavoittaa Discordin
    # käytännössä aina alle tunnissa, vaikka GitHub viivästyttäisi yksittäistä ajoa.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}  # Mahdollistaa manuaalisen ajon "Run workflow" -napista

permissions:
  contents: write  # Tarvitaan, jotta workflow voi committaa päivittyneen seen_events.json:n

# Estää kahta ajoa pyörimästä yhtä aikaa. Jos uusi ajo alkaa vanhan ollessa kesken,
# se odottaa edellisen valmistumista -> ei tuplailmoituksia päällekkäisistä ajoista.
concurrency:
  group: kuulaportti-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run check script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node check_kuulaportti.js

      - name: Commit updated seen_events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_events.json
          if git diff --quiet --cached; then
            echo "Ei muutoksia committoitavaksi."
          else
            git commit -m "Päivitetään nähdyt tapahtumat"
            # Haetaan mahdolliset toisen ajon tekemät muutokset ennen pushia.
            git pull --rebase origin main
            git push
          fi
